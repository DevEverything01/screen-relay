<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native stream lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#eef3f7;font:14px system-ui,sans-serif}main{position:relative;width:min(100vw,1280px);line-height:0}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#080c10;outline:none;touch-action:none;cursor:crosshair}canvas:focus-visible{outline:2px solid #62d9c1;outline-offset:-2px}.controls{position:absolute;top:0;right:0;display:flex;align-items:center;gap:8px;padding:2px 6px;min-height:20px;line-height:16px;background:#111c; border-radius:0 0 0 5px;font-size:12px}button{font:inherit;color:inherit;background:#253b47;border:1px solid #54717e;border-radius:3px;cursor:pointer}button:focus-visible{outline:2px solid #62d9c1}p{line-height:1.4;margin:12px;max-width:75ch;color:#b7c4cb}a{color:#8cebd5}
</style>
</head>
<body><main><canvas id="screen" width="1280" height="720" tabindex="0" aria-label="Remote desktop. Focus to send keyboard and pointer input."></canvas><div class="controls"><span id="status" role="status" aria-live="polite">Connecting…</span><button id="reconnect" type="button">Reconnect</button></div></main><p id="hud" aria-label="Stream statistics">Drawn FPS: 0.0 · Stream Mbps: 0.00 · Container CPU (one core): unavailable · Container RAM: unavailable</p><p>Click the desktop to control it. Keyboard input uses US physical key positions; IME and unsupported keys are unavailable. The local cursor is an approximation of the remote cursor.</p><script src="viewer.js"></script></body></html>

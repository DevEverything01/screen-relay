name: native-stream
description: Build a native damage-driven Linux streaming prototype and compare its useful delivery and resource costs against Selkies and KasmVNC on the same local sandbox.
metric:
  primary:
    type: hard
    name: idle_cpuPercent
    direction: minimize
    target: 5
  degenerate_gates:
    - name: valid
      check: '== 1'
    - name: errors
      check: '== 0'
    - name: motion_visibleUpdatesPerSecond
      check: '>= 45'
    - name: scroll_visibleUpdatesPerSecond
      check: '>= 45'
    - name: textInkMeanAbsoluteError
      check: '<= 4.5'
    - name: psnrDb
      check: '>= 37.5'
  objectives:
    - name: motion_visibleUpdatesPerSecond
      direction: maximize
      role: required
      target: 50
      max_regression: {type: relative, value: 0.05}
    - name: motion_latencyP95Ms
      direction: minimize
      role: required
      target: 45
      max_regression: {type: absolute, value: 5}
    - name: motion_cpuPercent
      direction: minimize
      role: required
      target: 50
      max_regression: {type: relative, value: 0.05}
    - name: motion_memoryMiB
      direction: minimize
      role: required
      target: 225
      max_regression: {type: relative, value: 0.05}
    - name: motion_mbps
      direction: minimize
      role: required
      target: 2.5
      max_regression: {type: relative, value: 0.05}
  diagnostics:
    - {name: idle_memoryMiB}
    - {name: idle_mbps}
    - {name: idle_latencyP95Ms}
    - {name: motion_producerUpdatesPerSecond}
    - {name: scroll_cpuPercent}
    - {name: scroll_memoryMiB}
    - {name: scroll_mbps}
    - {name: motion_throttledMs}
measurement:
  command: node bench/run.mjs
  working_directory: .
  timeout_seconds: 300
  output_format: json
  per_case: false
  stability:
    mode: ladder
    repeat_count: 3
    aggregation: median
    comparison: {method: relative, relative_threshold: 0.05}
    ladder:
      smoke_command: node bench/run.mjs --self-check
      exploratory_pairs: 1
      confirmation_repeats: 3
      futility: {worse_factor: 1.5}
scope:
  mutable: [src, viewer, tests, Dockerfile, Makefile, session.sh, candidate.json, README.md, docs, .gitignore, .dockerignore]
  immutable: [bench, probes]
execution:
  mode: serial
  backend: worktree
  max_concurrent: 1
parallel:
  port_strategy: none
  shared_files: []
  exclusive_resources: [local-docker-vm, loopback-port-18093, browser-renderer]
dependencies:
  approved: [build-essential, pkg-config, libx11-dev, libxext-dev, libxdamage-dev, libxfixes-dev, libxtst-dev, libwebsockets-dev]
constraints:
  - The user explicitly approved proceeding with the native framework and parallel implementation on 2026-10-27.
  - Baseline candidate.json selects pinned Selkies; separate ENGINE=kasm measurements use the same image and harness.
  - The implementation must own native capture, scheduling, input and transport without launching Selkies, KasmVNC or an FFmpeg subprocess.
  - Use Xfce with compositing disabled, 1280x720, 2 CPU quota, 1536 MiB memory, software encoding and one local viewer.
  - New dependencies proposed for the same approval are build-essential, pkg-config, libx11-dev, libxext-dev, libxdamage-dev, libxfixes-dev, libxtst-dev, libwebsockets-dev.
  - Preserve input delivery, recover from disconnect and decoder stalls, and bound queued memory; do not drop dependent H264 frames.
  - Check IDR-then-silence browser decode before relying on single-frame acknowledgement credit.
  - Retain failed and timed-out observations. Report all five user-requested metrics even when targets fail.
  - Static-text comparison and the existing fixture do not establish equal motion quality or maximum FPS; report operating-point tradeoffs rather than a universal winner.
  - No held-out workload in this first local run; selection and reporting share the same fixture and results may fit it.
  - No remote paid infrastructure, deployment, push or PR. Local package downloads and bounded agents only.
  - Do not delete files or containers. Preserve existing benchmark artifacts and restore the live desktops after measurements.
stopping:
  max_iterations: 4
  max_hours: 2
  max_wall_hours: 4
  plateau_iterations: 3
  target_reached: true

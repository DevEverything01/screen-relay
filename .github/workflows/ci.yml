name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    name: Engine (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libx11-dev libxext-dev libxdamage-dev libxfixes-dev libxtst-dev \
            libx264-dev libwebsockets-dev libavcodec-dev libavutil-dev libswscale-dev
      - name: Install Wayland build dependencies
        if: matrix.runner == 'ubuntu-24.04'
        run: sudo apt-get install -y --no-install-recommends libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev
      - run: make -j"$(nproc)" BACKENDS="x11 wayland" relay-engine
        if: matrix.runner == 'ubuntu-24.04'
      - run: make -j"$(nproc)" relay-engine
        if: matrix.runner == 'ubuntu-24.04-arm'
      - run: make BACKENDS="x11 wayland" test
        if: matrix.runner == 'ubuntu-24.04'
      - run: make test
        if: matrix.runner == 'ubuntu-24.04-arm'

  windows:
    name: Engine (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make diffutils
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libwebsockets mingw-w64-ucrt-x86_64-x264 mingw-w64-ucrt-x86_64-ffmpeg
      - run: make -j"$(nproc)" relay-engine
      - run: make test

  macos:
    name: Engine (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install pkgconf x264 libwebsockets ffmpeg
      - run: make -j"$(sysctl -n hw.ncpu)" test-color test-flow test-capture-bucket test-input test-backend

  node:
    name: SDK and CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  smoke:
    name: Install and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: ./install.sh
      - run: PATH="$HOME/.local/bin:$PATH" tests/smoke.sh

  smoke-wayland:
    name: Install and smoke test (Wayland spawn)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: ./install.sh --backend wayland
      - run: PATH="$HOME/.local/bin:$PATH" RELAY_BACKEND=wayland tests/smoke.sh

  smoke-wayland-attach:
    name: Install and smoke test (Wayland attach)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: ./install.sh --backend wayland
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends labwc
      - name: Smoke test against labwc
        run: |
          set -eu
          runtime=$(mktemp -d)
          export XDG_RUNTIME_DIR=$runtime
          WLR_BACKENDS=headless WLR_RENDERER=pixman WLR_HEADLESS_OUTPUTS=1 labwc > "$runtime/labwc.log" 2>&1 &
          socket=''
          x11=''
          for _ in $(seq 100); do
            socket=$(find "$runtime" -maxdepth 1 -type s -name 'wayland-*' -print -quit)
            x11=$(find /tmp/.X11-unix -maxdepth 1 -type s -name 'X*' -print -quit 2>/dev/null || true)
            if [ -n "$socket" ] && [ -n "$x11" ]; then break; fi
            sleep 0.2
          done
          if [ -z "$socket" ] || [ -z "$x11" ]; then cat "$runtime/labwc.log"; exit 1; fi
          PATH="$HOME/.local/bin:$PATH" DISPLAY=":${x11##*/X}" RELAY_BACKEND=wayland RELAY_DISPLAY="${socket##*/}" tests/smoke.sh

  macos-token-acl:
    name: macOS token ACL
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: brew install pkgconf libwebsockets openssl
      - name: Compile the server sources
        run: |
          for source in src/engine/server/*.cpp; do
            c++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -pthread -DRELAY_BACKEND_x11 -Isrc/engine -c "$source" \
              $(pkg-config --cflags libwebsockets openssl) -o /dev/null
          done
      - run: |
          mkdir -p build
          c++ -std=c++17 -Wall -Wextra -Wpedantic -pthread -Isrc/engine $(pkg-config --cflags libwebsockets openssl) tests/unit/macos-config-test.cpp src/engine/server/config.cpp -o build/macos-config-test $(pkg-config --libs libwebsockets openssl)
          ./build/macos-config-test

  install:
    name: Install (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:trixie
          - image: ubuntu:24.04
          - image: ubuntu:26.04
          - image: fedora:44
            setup: dnf -y install https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-44.noarch.rpm &&
          - image: archlinux:latest
          - image: alpine:3.24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: >-
          docker run --rm -v "$PWD:/src" -w /src "${{ matrix.image }}"
          sh -c '${{ matrix.setup }} ./install.sh --prefix /usr/local && relay-engine --help && ./install.sh --backend wayland --no-desktop --prefix /usr/local && output=$(relay-engine --help) && printf "%s\n" "$output" | grep -Fx "Compiled backends: x11, wayland" && ./install.sh --backend all --no-desktop --prefix /usr/local && relay-engine --help && RELAY_BACKEND=wayland relay doctor'

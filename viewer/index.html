<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native stream lab</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10151c;color:#eef3f7;font:14px system-ui,sans-serif}main{position:relative;width:min(100vw,1280px);line-height:0;overflow:hidden}#screen{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#080c10;outline:none;touch-action:none;cursor:default}#screen:focus-visible{outline:2px solid #62d9c1;outline-offset:-2px}#cursor{position:absolute;pointer-events:none;z-index:1}.controls{z-index:2;position:absolute;top:0;right:0;display:flex;flex-wrap:wrap;max-width:100%;align-items:center;gap:8px;padding:2px 6px;min-height:20px;line-height:16px;background:#111c; border-radius:0 0 0 5px;font-size:12px}button{font:inherit;color:inherit;background:#253b47;border:1px solid #54717e;border-radius:3px;cursor:pointer}button:focus-visible{outline:2px solid #62d9c1}p{line-height:1.4;margin:12px;max-width:75ch;color:#b7c4cb}a{color:#8cebd5}
</style>
</head>
<body><main><canvas id="screen" width="1280" height="720" tabindex="0" aria-label="Remote desktop. Focus to send keyboard and pointer input."></canvas><canvas id="cursor" width="1" height="1" aria-hidden="true" hidden></canvas><div class="controls"><span id="status" role="status" aria-live="polite">Connecting…</span><label for="access-token">Access token (remote)</label><input id="access-token" type="password" size="12" autocomplete="off" spellcheck="false"><button id="reconnect" type="button">Reconnect</button></div></main><p id="hud" aria-label="Stream statistics">Drawn FPS: 0.0 · Stream Mbps: 0.00 · Cgroup CPU (one core): unavailable · Cgroup RAM: unavailable</p><p>Click the desktop to control it. Keyboard input uses US physical key positions; IME and unsupported keys are unavailable. Cursor shapes and hotspots come from the remote desktop.</p><script src="viewer.js"></script></body></html>
